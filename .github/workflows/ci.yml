name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing
          POSTGRES_DB: ticketing_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: ./mvnw clean install -DskipTests && ./mvnw test
        env:
          DB_USER: ticketing
          DB_PASSWORD: ticketing
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ticketing_db
  docker-build:
     name: Build Events Docker Image
     runs-on: ubuntu-latest
     needs: build-and-test

     permissions:
       contents: read
       packages: write

     steps:
       - name: Checkout repository
         uses: actions/checkout@v5

       - name: Build Events Service image
         run: |
           docker build \
           -f events-service/Dockerfile \
           -t ghcr.io/${{ github.repository_owner }}/ticketing-events:${{ github.sha }} \
           .

       - name: Log in to GHCR
         if: github.event_name == 'push' && github.ref == 'refs/heads/main'
         run: |
           echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor}}" \
            --password-stdin

       - name: Publish Docker image
         if: github.event_name == 'push' && github.ref == 'refs/heads/main'
         run: |
            docker push \
             ghcr.io/${{ github.repository_owner }}/ticketing-events:${{ github.sha }}        
